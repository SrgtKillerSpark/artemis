services:
  postgres:
    image: postgres:16-alpine
    container_name: artemis-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: artemis
      POSTGRES_PASSWORD: artemis_dev
      POSTGRES_DB: artemis
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
